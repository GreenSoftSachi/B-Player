name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.2.1.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.2.1-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.2.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: "B-Player v1.2.1 (Frosted Glass Acrylic Dropdown Menus for SW, Subtitle, Audio & More)"
          body: |
            ## 👑 B-Player v1.2.1 - Frosted Glass Menus Edition
            
            ### 🌟 What's New in v1.2.1:
            * 🪟 **Frosted Translucent Dropdown Windows**: All 4 top-right popups (SW/HW Decoder, Subtitle, Audio, and More `...`) now feature modern frosted acrylic glass backgrounds (`#CC0D1420`), glowing cyan borders (`#3300E5FF`), and smooth 14dp rounded corners so video shines through!
            * 🎵 **Direct Top Audio Dropdown Menu**: Audio icon now opens directly as a top popup dropdown just like SW and Subtitles, listing full audio language names with channel specs (e.g. Hindi 5.1, Tamil 5.1, English Stereo) plus quick Audio Delay.
            * 🔒 **Zero Unwanted Changes**: Preserved all existing core player logic, subtitle auto-pick, and playback mechanisms intact.
          files: release-apks/B-Player-v1.2.1.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
