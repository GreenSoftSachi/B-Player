name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.1.3.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.1.3-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.1.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          name: "B-Player v1.1.3 (Unified Gestures, 4K Smooth Zoom, Prev/Next & Compact Menus)"
          body: |
            ## 👑 B-Player v1.1.3 - MX Perfection Edition (Single APK for Android 10+)
            
            ### 🌟 What's New in v1.1.3:
            * 🔊 **100% Volume & Brightness Restored**: Left swipe for Brightness, Right swipe for Volume with sleek sliders.
            * 🚀 **4K / IMAX Smooth Zoom (No Freezing)**: Throttled decoder zoom pipeline and separated multi-touch pass so 4K 10-bit HEVC videos play buttery smooth without stalling or accidental pauses.
            * ⚡ **Compact SW / HW Dropdown**: Tapping HW/SW opens an instant compact popup menu directly under the button (`Auto`, `HW+`, `HW`, `SW`) instead of a giant bottom sheet.
            * ⏮️ **Previous & Next Buttons**: Added `⏮️` and `⏭️` controls flanking the central Play/Pause button for effortless navigation.
            * 💬 **Subtitle Themes & 2-Finger Resize**: Subtitle theme and styling apply instantly upon video start; pinch on subtitles to adjust font size.
            * 📱 **Compact Three-Dots (⋮) Menu**: Tapping `⋮` opens a sleek dropdown menu on the top right for Filters, Speed, Audio Delay & Settings.
            * 🎨 **Frosted Obsidian Glass Audio Selector**: Audio tracks selector styled in sleek Frosted Obsidian Glass with glowing cyan active indicators.
            * 📦 **Single APK**: Exactly one clean ~78MB APK (`B-Player-v1.1.3.apk`)!
          files: release-apks/B-Player-v1.1.3.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
