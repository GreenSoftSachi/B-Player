name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.1.1.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.1.1-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.1.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: "B-Player v1.1.1 (Hierarchical Folders, Compact Grid & Subtitles)"
          body: |
            ## 👑 B-Player v1.1.1 - Ultimate Release (Single Android 10+ APK)
            
            ### 🌟 What's New in v1.1.1:
            * 🎬 **Instant Video Playback**: Fixed Intent action (`ACTION_VIEW`) so all videos open and play instantly when tapped!
            * 📁 **Hierarchical Folders Navigation**: True folder structure (TV -> Films -> Videos) with iconic red badges!
            * 📱 **Compact Modern Grid**: App-icon sized compact tiles (columns adaptive 5-10 on tablets) replacing giant boxes!
            * 💬 **Auto-Load Subtitles**: External (.srt, .ass, .vtt) and internal subtitle tracks load automatically!
            * 📦 **Single APK**: Exactly one clean, lightweight 78MB APK (`B-Player-v1.1.1.apk`) for all Android 10+ devices!
          files: release-apks/B-Player-v1.1.1.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
