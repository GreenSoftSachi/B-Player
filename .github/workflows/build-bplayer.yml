name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.2.0.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.2.0-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "B-Player v1.2.0 (MX-Style Subtitle Browser, Smart Auto-Resume, Frosted Glass & Dual Storage)"
          body: |
            ## 👑 B-Player v1.2.0 - Ultimate MX Player Experience Edition
            
            ### 🌟 What's New in v1.2.0:
            * 📂 **In-Player Subtitle File Browser (MX-Style)**: Tapping "Open Subtitle..." opens a sleek, frosted glass browser dialog right in the player center at the movie's directory. Tap outside to dismiss!
            * ⏸️▶️ **Smart Settings Auto-Pause & Resume**: Opening any settings, sheet, or dialog pauses the video; exiting automatically resumes playback seamlessly!
            * 🪟 **Frosted Translucent Windows**: All sheets, dialogs, and menus now use sleek semi-transparent frosted acrylic glass so the movie remains visible underneath.
            * 📱💾 **Default Dual Storage View**: App launch always begins at root Storage, clearly showing Internal Storage (Cyan) and SD Card / Chip (Emerald) before navigating folders.
            * 📦 **Single APK**: Exactly one clean ~81MB APK (`B-Player-v1.2.0.apk`)!
          files: release-apks/B-Player-v1.2.0.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
