name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.2.3.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.2.3-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.2.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: "B-Player v1.2.3 (Rotation Persistence, PC-Style Drives & File Management: Copy, Paste, Recycle Bin Delete)"
          body: |
            ## 👑 B-Player v1.2.3 - Rotation Fix, PC Drives & File Operations Edition
            
            ### 🌟 What's New in v1.2.3:
            * 🔄 **Screen Rotation State Persistence**: Rotating the phone (portrait to landscape or vice versa) will never reset your folder path back to root!
            * 💽 **PC-Style Storage Drives ("This PC" Experience)**: At root Storage view, Internal Storage and SD Card / Chip are rendered as PC drives with disk icons, real storage space meters (free/total GB), and cyber cyan / emerald accents. Inside drives, contents are organized as standard folders!
            * 📋 **Long-Press File Actions (Copy & Paste)**: Long press any video or folder to Copy, and tap the glowing Cyan "Paste here" button in the top bar to paste into any folder!
            * 🗑️ **Dual Deletion (Recycle Bin vs Permanent Delete)**: Long press Delete presents two choices: "Move to Recycle Bin" (safe recovery) or "Delete Permanently", with instant media rescanning!
          files: release-apks/B-Player-v1.2.3.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
