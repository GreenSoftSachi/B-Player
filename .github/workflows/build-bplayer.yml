name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.1.8.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.1.8-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.1.8
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.8
          name: "B-Player v1.1.8 (HW-Style Subtitle Dropdown & Direct Movie Folder Picker)"
          body: |
            ## 👑 B-Player v1.1.8 - Precision Subtitle Dropdown Edition
            
            ### 🌟 What's New in v1.1.8:
            * 💬 **HW-Style Subtitle Dropdown**: Subtitle icon now opens a sleek, compact dropdown popup anchored directly underneath the top bar icon, just like the HW decoder menu!
            * ⚡ **Auto-Select Movie Subtitles**: Embedded and folder subtitles are now automatically loaded and selected when the video starts playing.
            * 📁 **Direct Movie Folder Navigation**: "Open Subtitle..." now launches the file picker directly inside the playing movie's directory for instant 1-click subtitle selection.
            * 🚫 **Dedicated Off (None) Option**: Easily toggle subtitles off with a single tap in the dropdown.
            * 📦 **Single APK**: Exactly one clean ~81MB APK (`B-Player-v1.1.8.apk`)!
          files: release-apks/B-Player-v1.1.8.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
