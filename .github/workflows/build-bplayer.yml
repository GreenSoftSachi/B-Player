name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.1.9.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.1.9-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.1.9
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.9
          name: "B-Player v1.1.9 (Full Subtitle Language Names & Document Provider Direct Folder Navigation)"
          body: |
            ## 👑 B-Player v1.1.9 - Precision Language Names & Direct Folder Navigation Edition
            
            ### 🌟 What's New in v1.1.9:
            * 🗣️ **Complete Full Language Names**: Subtitle languages are now displayed as complete names like "Hindi", "Tamil", "English", "Sinhala", etc. instead of cryptic 2-letter codes!
            * 📁 **True Direct Folder Navigation**: "Open Subtitle..." now builds an official Android External Storage Document URI (`content://com.android.externalstorage.documents/...`), opening Android DocumentsUI directly into the exact directory of the playing video.
            * 📦 **Single APK**: Exactly one clean ~81MB APK (`B-Player-v1.1.9.apk`)!
          files: release-apks/B-Player-v1.1.9.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
