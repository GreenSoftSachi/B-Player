name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.1.6.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.1.6-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.1.6
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.6
          name: "B-Player v1.1.6 (Pure Circular Red Badges & Shadowless Compact Seek Time)"
          body: |
            ## 👑 B-Player v1.1.6 - Perfect Geometry & Shadowless Seek Edition
            
            ### 🌟 What's New in v1.1.6:
            * 🔴 **Pure Circular Red Badges**: Folder video count badges are now 100% round circles with perfectly centered digits, completely un-elongated!
            * ⏱️ **Shadowless Compact Seek Indicator**: Completely removed the heavy shadow/border box around the center seek time display for a sleek, compact floating text indicator.
            * 📦 **Single APK**: Exactly one clean ~78MB APK (`B-Player-v1.1.6.apk`)!
          files: release-apks/B-Player-v1.1.6.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
