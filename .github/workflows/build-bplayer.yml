name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.1.7.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.1.7-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.1.7
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.7
          name: "B-Player v1.1.7 (Video Thumbnails, Mini 16dp Badges & Ultra Compact Seek)"
          body: |
            ## 👑 B-Player v1.1.7 - MediaStore Thumbnails & Precision Geometry Edition
            
            ### 🌟 What's New in v1.1.7:
            * 🖼️ **Real Video Preview Thumbnails**: Replaced blank boxes with hardware-accelerated MediaStore video preview thumbnails for each video file!
            * 🔴 **Mini 16dp Pure Circular Badges**: Folder video count badges are now perfectly round 16dp circles with centered digits, exactly as designed.
            * ⏱️ **Ultra Compact Floating Seek Time**: Shadowless, borderless floating seek indicator with cyan delta and white target time.
            * 📦 **Single APK**: Exactly one clean ~78-81MB APK (`B-Player-v1.1.7.apk`)!
          files: release-apks/B-Player-v1.1.7.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
