name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.2.5.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.2.5-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.2.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.5
          name: "B-Player v1.2.5 (Real Internal & SD Card Storage Capacity Calculation)"
          body: |
            ## 👑 B-Player v1.2.5 - Storage Drives Calculation Fix

            ### 🌟 What's New in v1.2.5:
            * 💽 **Accurate Internal & SD Card Capacity**: Integrated Android `StorageStatsManager`, `StorageManager.storageVolumes`, and `ContextCompat.getExternalFilesDirs` to display the exact real total size and free space (e.g. `XX.X GB free of XX.X GB`) for both Internal Storage (C:) and SD Card Chip (D:).
            * 📁 **SD Card Discovery**: Automatically detects physical SD Cards and mounts them properly to the real file path instead of falling back to internal storage.
            * 🛡️ **Full Storage Permissions**: Seamless "All Files Access" prompt for Android 11+ ensuring Copy, Paste, and Delete work without permission errors.
          files: release-apks/B-Player-v1.2.5.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
