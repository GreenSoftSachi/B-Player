name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.2.2.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.2.2-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.2.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: "B-Player v1.2.2 (MX-Style Audio Track Dialog with Radio Buttons, SW Audio Decoder & Open Browser)"
          body: |
            ## 👑 B-Player v1.2.2 - Ultimate MX-Style Audio Experience
            
            ### 🌟 What's New in v1.2.2:
            * 🎵 **MX-Style Audio Track Dialog**: Centered translucent frosted glass popup window (`#DD0D1420`) with glowing cyan border (`#3300E5FF`).
            * 🔘 **Clean Audio Radio Buttons**: Neatly lists all movie audio tracks with radio buttons (e.g., `◉ Audio Track #1 - English (5.1)`, `○ Audio Track #2 - Tamil (Stereo)`).
            * 🚫 **Disable Option**: Quick radio button to mute/disable audio track when needed.
            * ⚙️ **Use SW Audio Decoder**: Integrated checkbox to easily switch and force software libavcodec audio decoding.
            * 📂 **In-Player Audio File Browser**: Bottom "Open" button opens a frosted-glass audio file browser directly in the movie folder to pick external audio tracks (.mp3, .m4a, .aac, .ac3, .dts, .flac, .opus, etc.) and auto-select instantly.
          files: release-apks/B-Player-v1.2.2.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
