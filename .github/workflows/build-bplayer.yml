name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.2.4.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.2.4-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.2.4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.4
          name: "B-Player v1.2.4 (All Files Access Permission & Robust Copy, Paste, Recycle Bin Delete)"
          body: |
            ## 👑 B-Player v1.2.4 - Full Storage Access & File Operations Fix

            ### 🌟 What's New in v1.2.4:
            * 🛡️ **All Files Access (`MANAGE_EXTERNAL_STORAGE`)**: Seamless permission prompt for Android 11+ (API 30+) devices ensuring full read, write, copy, paste, and delete access across all storage volumes.
            * 📋 **Rock-Solid Copy & Paste**: Copy video files or entire folders and paste them anywhere with automatic duplicate handling (`filename_copy1.mp4`) and real-time MediaStore synchronization.
            * 🗑️ **Dual Deletion (Recycle Bin vs Permanent Delete)**: "Move to Recycle Bin" uses hidden `.bplayer_trash` folder with `.nomedia` for safe recovery, or permanently erase files and folders with immediate media library refresh.
            * 🔄 **Screen Rotation Persistence**: Seamless folder navigation that retains your active folder hierarchy when rotating between Portrait and Landscape orientations.
          files: release-apks/B-Player-v1.2.4.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
