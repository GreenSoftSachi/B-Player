name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          # Package the single best 64-bit APK for Android 10+ devices
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/B-Player-v1.2.6.apk
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.2.6-APK
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.2.6
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.6
          name: "B-Player v1.2.6 (Home Screen Storage Drives Grid & List View Toggle Fix)"
          body: |
            ## 👑 B-Player v1.2.6 - Home Screen Grid/List View Toggle Fix

            ### 🌟 What's New in v1.2.6:
            * 🔲 **Home Screen Drives Grid & List View**: Tapping the top-right view button on the Home Screen (Drives view) now seamlessly toggles between full-width PC drive list items and 2-column cyber PC drive grid cards!
            * 💽 **Real Internal & SD Card Capacity**: Exact storage space and free space display for internal storage and removable SD card chip.
            * 🛡️ **All Files Access**: Smooth Scoped Storage permissions for copying, pasting, and deleting.
          files: release-apks/B-Player-v1.2.6.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
