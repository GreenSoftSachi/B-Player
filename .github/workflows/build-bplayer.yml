name: Build & Release B-Player

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build B-Player APKs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APKs
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Player-v1.0.0-APKs
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "B-Player v1.1.0 (Full MX Player Folder Suite & Media Library)"
          body: |
            ## 👑 B-Player v1.1.0 - Full Media Library & Folder Suite Release
            
            ### 🌟 Major Upgrades in v1.1.0:
            * 📁 **Full Media Auto-Scanner**: No more empty white screens or manual URL boxes! B-Player now automatically scans and indexes all your videos and movies.
            * 🔴 **Iconic Folder Red Badges**: Real-time video count badges (`1`, `2`, `5`, `13`, `99+`) on folder cards just like classic MX Player.
            * 🎛️ **2-Column Grid View & List Toggle**: Switch seamlessly between modern 2-column card grids and streamlined list views.
            * 📄 **Folder View vs Flat Files Mode**: Browse by directory hierarchy or view all videos in one clean list.
            * 🧹 **Junk File Cleaner**: Automatic filter removing zero-duration and <200KB dummy development files.
            * 🔙 **Smart Back Navigation**: Back button smoothly returns from a folder to the main folder list instead of closing the app.
            * 🚀 **Unrivaled Playback**: Built on the beast `libmpv` C++ playback engine and `libass` subtitle engine for flawless 4K 10-bit HEVC, Dolby Vision, and 6CH EAC3 Atmos audio.
            
            Download the APK below to install on your Android device!
          files: release-apks/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
